name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: # Manual trigger from GitHub UI

# ─── Environment ──────────────────────────────────────────────
env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ANDROID_API: "34"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── 3. Java ───────────────────────────────────────────────
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      # ── 4. Android SDK ────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install npm deps ────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Generate image-list.json ───────────────────────────
      - name: Generate image-list.json
        run: node gen.js

      # ── 7. Add / sync Capacitor Android ──────────────────────
      - name: Capacitor sync
        run: |
          # Add android platform if not present
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # ── 8. Decode keystore (for signed release builds) ────────
      #   Store these in GitHub → Settings → Secrets:
      #     KEYSTORE_BASE64    : base64-encoded .jks file
      #     KEYSTORE_PASS      : keystore password
      #     KEY_ALIAS          : key alias
      #     KEY_PASS           : key password
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release-key.jks

      # ── 9. Build APK ──────────────────────────────────────────
      - name: Build debug APK (no keystore)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASS }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASS }} \
            --stacktrace

      # ── 10. Collect APK ───────────────────────────────────────
      - name: Locate and rename APK
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "Found APK: $APK"
          # Stamp with short SHA for traceability
          SHA=$(echo "${{ github.sha }}" | head -c 7)
          DEST="japa-session-${SHA}.apk"
          cp "$APK" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV
          echo "APK_NAME=$DEST" >> $GITHUB_ENV

      # ── 11. Upload build artifact ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JapaSession-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 12. Create GitHub Release (on tag push) ───────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Japa Session ${{ github.ref_name }}"
          body: |
            ## Japa Session Tool ${{ github.ref_name }}

            ### What's included
            - Configurable japa timer (1 min → 30 min, or custom)
            - Temple bell × 3 on completion
            - Hare Krishna mantra display with slideshow
            - Full offline support
            - Responsive for all screen sizes

            ### Install
            Download the APK below and sideload on Android.
            _(Allow "Install unknown apps" in Android settings if prompted.)_
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
